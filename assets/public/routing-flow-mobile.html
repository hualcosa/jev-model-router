x="44" y="616" class="copy">Verified model + supported effort?</text><text x="44" y="648" class="copy">No safe route? Leave unchanged.</text><rect x="24" y="720" width="342" height="88" rx="8" class="focal"/><text x="44" y="752" class="name">4. Apply model + effort</text><text x="44" y="780" class="copy">Native host starts the worker.</text><line x1="24" y1="848" x2="366" y2="848" class="rule"/><text x="24" y="884" class="small">Main-session settings stay unchanged.</text><text x="24" y="912" class="small">Explicit choices win. Failures inherit.</text><text x="24" y="940" class="small">No guessed model IDs or effort values.</text><text x="24" y="968" class="small">No expanded permissions.</text></svg></div></main></html>
