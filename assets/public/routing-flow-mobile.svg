<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 996" role="img" aria-labelledby="routing-flow-mobile-title routing-flow-mobile-desc" id="routing-flow-mobile-root"><title id="routing-flow-mobile-title">A route must earn its way in.</title><desc id="routing-flow-mobile-desc">Eligibility and consent precede classification and local policy; rejected checks and failures preserve the request instead of guessing a route.</desc><defs>
      <style>#routing-flow-mobile-root { --paper:#e8f0ef;--panel:#f7faf9;--ink:#10191d;--muted:#445c60;--line:#647c7c;--accent:#176852;--tint:#d8ebe4;--rule:#abc0bd }
      @media(prefers-color-scheme:dark) {
#routing-flow-mobile-root { --paper:#10191d;--panel:#19272b;--ink:#e8f0ef;--muted:#b5cac7;--line:#9db6b2;--accent:#87d8be;--tint:#183c33;--rule:#4b6364 }
}
      #routing-flow-mobile-root { color: var(--ink); }
      #routing-flow-mobile-root .diagram-container { width:100%;overflow-x:auto }
      #routing-flow-mobile-root .paper { fill:var(--paper) }
      #routing-flow-mobile-root .panel { fill:var(--panel);stroke:var(--line);stroke-width:1.5 }
      #routing-flow-mobile-root .focal { fill:var(--tint);stroke:var(--accent);stroke-width:2 }
      #routing-flow-mobile-root .ink { fill:var(--ink) }
      #routing-flow-mobile-root .muted { fill:var(--muted) }
      #routing-flow-mobile-root .accent { fill:var(--accent) }
      #routing-flow-mobile-root .title { font:400 40px 'Instrument Serif',Georgia,serif;fill:var(--ink) }
      #routing-flow-mobile-root .name { font:600 20px 'Geist',system-ui,sans-serif;fill:var(--ink) }
      #routing-flow-mobile-root .copy { font:400 16px 'Geist',system-ui,sans-serif;fill:var(--muted) }
      #routing-flow-mobile-root .tag { font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:1.5px;fill:var(--accent) }
      #routing-flow-mobile-root .small { font:400 14px 'Geist',system-ui,sans-serif;fill:var(--muted) }
      #routing-flow-mobile-root .arrow { fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#routing-flow-mobile-arrow) }
      #routing-flow-mobile-root .dashed { stroke-dasharray:5 5 }
      #routing-flow-mobile-root .rule { stroke:var(--rule);stroke-width:1 }
      #routing-flow-mobile-root .label { font:500 12px 'Geist Mono',ui-monospace,monospace;fill:var(--muted) }
      @media print {
#routing-flow-mobile-root .diagram-container { overflow-x:visible }
}
      #routing-flow-mobile-root .tag, #routing-flow-mobile-root .label, #routing-flow-mobile-root .small { font-size:16px }
      #routing-flow-mobile-root .title { font-size:28px }</style><marker id="routing-flow-mobile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="390" height="996" rx="0" class="paper"/><text x="24" y="40" class="tag">JEV / DECISION FLOW</text><text x="24" y="84" class="title">A route must earn its way in.</text><text x="24" y="124" class="copy">Start with a delegated assignment.</text><path d="M 195 320 V 368" class="arrow "/><path d="M 195 480 V 528" class="arrow "/><path d="M 195 672 V 720" class="arrow "/><rect x="24" y="176" width="342" height="144" rx="8" class="panel"/><text x="44" y="208" class="name">1. Eligibility + consent</text><text x="44" y="236" class="copy">Generic, unpinned, valid boundary?</text><text x="44" y="264" class="copy">Pins / custom profiles: preserve.</text><text x="44" y="296" class="copy">Not eligible? Do not classify.</text><rect x="24" y="368" width="342" height="112" rx="8" class="focal"/><text x="44" y="400" class="name">2. Jev classifies the task</text><text x="44" y="428" class="copy">Extract task requirements.</text><text x="44" y="456" class="copy">Abstention / failure: inherit.</text><rect x="24" y="528" width="342" height="144" rx="8" class="panel"/><text x="44" y="560" class="name">3. Local policy checks</text><text x="44" y="588" class="copy">Risk · confidence · catalog</text><text x="44" y="616" class="copy">Verified model + supported effort?</text><text x="44" y="648" class="copy">No safe route? Leave unchanged.</text><rect x="24" y="720" width="342" height="88" rx="8" class="focal"/><text x="44" y="752" class="name">4. Apply model + effort</text><text x="44" y="780" class="copy">Native host starts the worker.</text><line x1="24" y1="848" x2="366" y2="848" class="rule"/><text x="24" y="884" class="small">Main-session settings stay unchanged.</text><text x="24" y="912" class="small">Explicit choices win. Failures inherit.</text><text x="24" y="940" class="small">No guessed model IDs or effort values.</text><text x="24" y="968" class="small">No expanded permissions.</text></svg>
