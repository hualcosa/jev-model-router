<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routing Flow</title><style>
:root{--paper:#e8f0ef;--panel:#f7faf9;--ink:#10191d;--muted:#445c60;--line:#647c7c;--accent:#176852;--tint:#d8ebe4;--rule:#abc0bd}
@media(prefers-color-scheme:dark){:root{--paper:#10191d;--panel:#19272b;--ink:#e8f0ef;--muted:#b5cac7;--line:#9db6b2;--accent:#87d8be;--tint:#183c33;--rule:#4b6364}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:100%;min-width:0}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block;height:auto}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focal{fill:var(--tint);stroke:var(--accent);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.title{font:400 40px 'Instrument Serif',Georgia,serif;fill:var(--ink)}.name{font:600 20px 'Geist',system-ui,sans-serif;fill:var(--ink)}.copy{font:400 16px 'Geist',system-ui,sans-serif;fill:var(--muted)}.tag{font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:1.5px;fill:var(--accent)}.small{font:400 14px 'Geist',system-ui,sans-serif;fill:var(--muted)}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 5}.rule{stroke:var(--rule);stroke-width:1}.label{font:500 12px 'Geist Mono',ui-monospace,monospace;fill:var(--muted)}
@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
</style><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 848" role="img" aria-labelledby="routing-flow-title routing-flow-desc"><title id="routing-flow-title">A route must earn its way in.</title><desc id="routing-flow-desc">Eligibility and consent precede Jev classification; local safety and runtime checks select a model and effort or leave the original request unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="960" height="848" rx="0" class="paper"/><text x="40" y="48" class="tag">JEV MODEL ROUTER / DECISION FLOW</text><text x="40" y="100" class="title">A route must earn its way in.</text><text x="40" y="140" class="copy">Start with a delegated assignment. Keep the main session unchanged.</text><path d="M 300 304 V 352" class="arrow "/><path d="M 540 248 H 644" class="arrow "/><path d="M 300 440 V 488" class="arrow "/><path d="M 540 544 H 644" class="arrow "/><path d="M 300 600 V 664" class="arrow "/><rect x="308" y="314" width="44" height="20" rx="0" class="paper"/><text x="312" y="328" class="label">YES</text><rect x="564" y="220" width="44" height="20" rx="0" class="paper"/><text x="568" y="234" class="label">NO</text><rect x="308" y="618" width="44" height="20" rx="0" class="paper"/><text x="312" y="632" class="label">YES</text><rect x="564" y="516" width="44" height="20" rx="0" class="paper"/><text x="568" y="530" class="label">NO</text><path d="M 300 192 L 540 248 L 300 304 L 60 248 Z" class="panel"/><text x="300" y="244" class="name" text-anchor="middle">Eligible + consented?</text><text x="300" y="272" class="small" text-anchor="middle">Generic · unpinned · supported</text><rect x="644" y="200" width="276" height="96" rx="8" class="panel"/><text x="664" y="232" class="name">Preserve the request</text><text x="664" y="260" class="small">Explicit pins or custom profile?</text><text x="664" y="280" class="small">Do not classify or override.</text><rect x="120" y="352" width="360" height="88" rx="8" class="focal"/><text x="144" y="388" class="name">Jev classifies requirements</text><text x="144" y="416" class="copy">What does this assignment need?</text><path d="M 300 488 L 540 544 L 300 600 L 60 544 Z" class="panel"/><text x="300" y="540" class="name" text-anchor="middle">Safe, supported route?</text><text x="300" y="568" class="small" text-anchor="middle">Risk · confidence · catalog · effort</text><rect x="644" y="496" width="276" height="112" rx="8" class="panel"/><text x="664" y="528" class="name">Inherit / no rewrite</text><text x="664" y="556" class="small">Abstain, unavailable or invalid?</text><text x="664" y="580" class="small">Leave routing unchanged.</text><rect x="120" y="664" width="360" height="80" rx="8" class="focal"/><text x="144" y="696" class="name">Apply model + effort</text><text x="144" y="724" class="copy">Native host starts the worker.</text><line x1="40" y1="776" x2="920" y2="776" class="rule"/><text x="40" y="804" class="small">Classification failure also inherits. No guessed model IDs or unsupported effort values.</text><text x="40" y="828" class="small">Permissions, task content and the main-session configuration are not expanded.</text></svg></div></main></html>
