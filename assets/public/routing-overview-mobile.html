"342" height="216" rx="8" class="panel"/><text x="44" y="688" class="name">Native worker hosts</text><text x="44" y="724" class="name">Claude Code</text><text x="44" y="752" class="copy">Final-classic native adapter</text><text x="44" y="792" class="name">Codex</text><text x="44" y="820" class="copy">Plaintext prepare bridge</text><text x="44" y="848" class="copy">Single-use ref → native spawn</text><line x1="24" y1="912" x2="366" y2="912" class="rule"/><text x="24" y="948" class="small">Pins and custom profiles are preserved.</text><text x="24" y="976" class="small">Abstention or failure: no rewrite.</text><text x="24" y="1004" class="small">The host executes the worker.</text></svg></div></main></html>
