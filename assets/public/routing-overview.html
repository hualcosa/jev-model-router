<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routing Overview</title><style>
:root{--paper:#e8f0ef;--panel:#f7faf9;--ink:#10191d;--muted:#445c60;--line:#647c7c;--accent:#176852;--tint:#d8ebe4;--rule:#abc0bd}

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:100%;min-width:0}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block;height:auto}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focal{fill:var(--tint);stroke:var(--accent);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.title{font:400 40px 'Instrument Serif',Georgia,serif;fill:var(--ink)}.name{font:600 20px 'Geist',system-ui,sans-serif;fill:var(--ink)}.copy{font:400 16px 'Geist',system-ui,sans-serif;fill:var(--muted)}.tag{font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:1.5px;fill:var(--accent)}.small{font:400 14px 'Geist',system-ui,sans-serif;fill:var(--muted)}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 5}.rule{stroke:var(--rule);stroke-width:1}.label{font:500 12px 'Geist Mono',ui-monospace,monospace;fill:var(--muted)}

</style><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="routing-overview-title routing-overview-desc"><title id="routing-overview-title">Keep the orchestrator. Route the work.</title><desc id="routing-overview-desc">The main session is preserved while eligible delegated tasks pass through Jev classification and local policy to native Claude Code or Codex workers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="960" height="680" rx="0" class="paper"/><text x="40" y="48" class="tag">JEV MODEL ROUTER / OVERVIEW</text><text x="40" y="100" class="title">Keep the orchestrator. Route the work.</text><rect x="40" y="136" width="880" height="80" rx="8" class="panel"/><text x="64" y="168" class="name">Main session: unchanged</text><text x="64" y="196" class="copy">Your chosen model and effort stay in control. Routing targets eligible workers only.</text><path d="M 276 332 H 328" class="arrow "/><path d="M 592 332 H 644" class="arrow "/><path d="M 736 396 V 420 Q 736 428 728 428 H 256 Q 248 428 248 436 V 464" class="arrow "/><path d="M 784 396 V 444 Q 784 452 776 452 H 716 Q 708 452 708 460 V 464" class="arrow "/><text x="40" y="256" class="tag">DELEGATED ASSIGNMENT</text><rect x="40" y="284" width="236" height="112" rx="8" class="panel"/><text x="60" y="320" class="name">Eligible worker task</text><text x="60" y="352" class="copy">Generic and unpinned</text><text x="60" y="376" class="small">Consent checked first</text><rect x="328" y="284" width="264" height="112" rx="8" class="focal"/><text x="348" y="320" class="name">Jev classifies the task</text><text x="348" y="352" class="copy">Task requirements, not</text><text x="348" y="376" class="copy">a model-selection command</text><rect x="644" y="284" width="276" height="112" rx="8" class="panel"/><text x="664" y="320" class="name">Local policy selects</text><text x="664" y="352" class="copy">Model + supported effort</text><text x="664" y="376" class="small">Risk, confidence, catalog</text><rect x="40" y="464" width="412" height="104" rx="8" class="panel"/><text x="60" y="496" class="name">Claude Code</text><text x="60" y="524" class="copy">Final-classic native adapter</text><text x="60" y="548" class="small">Eligible spawn → native worker</text><rect x="500" y="464" width="420" height="104" rx="8" class="panel"/><text x="520" y="496" class="name">Codex</text><text x="520" y="524" class="copy">Plaintext prepare bridge</text><text x="520" y="548" class="small">Single-use reference → native spawn</text><line x1="40" y1="600" x2="920" y2="600" class="rule"/><text x="40" y="628" class="small">Pins and custom profiles are preserved. Abstention or failure leaves routing unchanged.</text><text x="40" y="652" class="small">Jev classifies. Local policy decides. The host runs the worker.</text></svg></div></main></html>
