<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Preview</title><style>
:root{--paper:#e8f0ef;--panel:#f7faf9;--ink:#10191d;--muted:#445c60;--line:#647c7c;--accent:#176852;--tint:#d8ebe4;--rule:#abc0bd}
@media(prefers-color-scheme:dark){:root{--paper:#10191d;--panel:#19272b;--ink:#e8f0ef;--muted:#b5cac7;--line:#9db6b2;--accent:#87d8be;--tint:#183c33;--rule:#4b6364}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:100%;min-width:0}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:960px;display:block;height:auto}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.focal{fill:var(--tint);stroke:var(--accent);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.title{font:400 40px 'Instrument Serif',Georgia,serif;fill:var(--ink)}.name{font:600 20px 'Geist',system-ui,sans-serif;fill:var(--ink)}.copy{font:400 16px 'Geist',system-ui,sans-serif;fill:var(--muted)}.tag{font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:1.5px;fill:var(--accent)}.small{font:400 14px 'Geist',system-ui,sans-serif;fill:var(--muted)}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 5}.rule{stroke:var(--rule);stroke-width:1}.label{font:500 12px 'Geist Mono',ui-monospace,monospace;fill:var(--muted)}
@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
svg{min-width:1280px}@media print{svg{min-width:0}}</style><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="social-preview-title social-preview-desc"><title id="social-preview-title">Jev Model Router</title><desc id="social-preview-desc">Keep the orchestrator and route eligible delegated work through classification and local policy while preserving explicit choices.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1280" height="640" rx="0" class="paper"/><text x="64" y="88" class="tag">JEV MODEL ROUTER</text><text x="64" y="180" class="title">Keep the orchestrator.</text><text x="64" y="236" class="title">Route the work.</text><text x="64" y="292" class="copy">Task-aware model and effort routing for delegated agents.</text><path d="M 372 420 H 440" class="arrow "/><path d="M 764 420 H 832" class="arrow "/><rect x="64" y="368" width="308" height="104" rx="8" class="panel"/><text x="88" y="408" class="name">Delegate a task</text><text x="88" y="440" class="copy">Generic, unpinned assignment</text><rect x="440" y="368" width="324" height="104" rx="8" class="focal"/><text x="464" y="408" class="name">Classify with Jev</text><text x="464" y="440" class="copy">Requirements → local policy</text><rect x="832" y="368" width="384" height="104" rx="8" class="panel"/><text x="856" y="408" class="name">Route a native worker</text><text x="856" y="440" class="copy">Verified model + supported effort</text><line x1="64" y1="520" x2="1216" y2="520" class="rule"/><text x="64" y="560" class="tag">MAIN SESSION PRESERVED</text><text x="620" y="560" class="copy">Explicit choices win. Failures inherit.</text></svg></div></main></html>
